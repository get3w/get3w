name: Get3W public Desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: public-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop-verification:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Build, package and verify the isolated Desktop runtime
        run: python3 scripts/verify-public-release.py --desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-verification-macos-x64
          path: |
            artifacts/verification/*.log
            artifacts/verification/*.json
          retention-days: 14
