name: Release Get3W Desktop
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
          # Linux is not released (decided 2026-11-10).
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GET3W_COMPUTER_USE_SIGN_IDENTITY: '-'
      SIGN_WINDOWS: 'false'
      MACOS_NOTARIZE: 'false'
    steps:
      - name: Preserve source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v5
        with:
          version: 11.4.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Verify version and public source
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("apps/desktop/package.json")).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== `v${v}`) throw Error("Tag/package version mismatch");'
          python3 scripts/verify-public-source.py
          python3 scripts/check-public-workspace.py
          python3 scripts/check-public-personal-boundary.py
          python3 scripts/check-public-brand.py
          python3 scripts/check-public-licenses.py
      - name: Import macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/get3w-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY='Developer ID Application: xinxing lai (XHS3S9KT4A)'
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "$IDENTITY"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          {
            echo "CSC_NAME=xinxing lai (XHS3S9KT4A)"
            echo "CSC_KEYCHAIN=$KEYCHAIN"
            echo "GET3W_COMPUTER_USE_SIGN_IDENTITY=$IDENTITY"
            echo "GET3W_COMPUTER_USE_CODESIGN_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
            echo "APPLE_API_KEY=${{ secrets.APPLE_API_KEY }}"
            echo "APPLE_API_ISSUER=${{ secrets.APPLE_API_ISSUER }}"
            echo "MACOS_NOTARIZE=true"
          } >> "$GITHUB_ENV"
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Rebuild native modules and build Desktop
        run: |
          pnpm --dir apps/desktop exec electron-rebuild --force --which-module better-sqlite3
          pnpm build
      - name: Package installers and updater manifests
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config.publish.provider=generic --config.publish.url=https://github.com/get3w/get3w/releases/latest/download
      - name: Verify macOS packaged engine
        if: matrix.platform == 'mac'
        run: |
          APP=$(find apps/desktop/dist-electron -maxdepth 2 -name Get3W.app -type d | head -1)
          test -n "$APP"
          pnpm --dir apps/desktop exec asar extract "$PWD/$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/asar"
          python3 scripts/verify-public-package.py "$APP" "$RUNNER_TEMP/asar" "$RUNNER_TEMP/package-inventory.json"
          ELECTRON_RUN_AS_NODE=1 GET3W_TEST_EMBEDDED_MODULE_URL="file://$PWD/$APP/Contents/Resources/app.asar/server/dist/embedded.js" GET3W_TEST_ENGINE_BIN="$PWD/$APP/Contents/Resources/sidecars/opencode" "$APP/Contents/MacOS/Get3W" --test apps/desktop/test/engine-cold-start.test.mjs
      - name: Remove macOS signing credentials
        if: always() && matrix.platform == 'mac'
        run: |
          security delete-keychain "$RUNNER_TEMP/get3w-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/get3w-*
            apps/desktop/dist-electron/latest*.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts/release-input
      - name: Validate all four platforms and merge updater metadata
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/release/assemble.py artifacts/release-input artifacts/release-public "${GITHUB_REF_NAME#v}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Get3W $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh release upload "$GITHUB_REF_NAME" artifacts/release-public/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
