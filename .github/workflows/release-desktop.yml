name: Release Get3W Desktop
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
          - runner: windows-2025
            platform: win
            arch: x64
          - runner: windows-11-arm
            platform: win
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      OPENWORK_COMPUTER_USE_SIGN_IDENTITY: '-'
      SIGN_WINDOWS: 'false'
      MACOS_NOTARIZE: 'false'
    steps:
      - name: Preserve source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - name: Verify version and public source
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("apps/desktop/package.json")).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== `v${v}`) throw Error("Tag/package version mismatch");'
          python3 scripts/verify-public-source.py
          python3 scripts/check-public-workspace.py
          python3 scripts/check-public-personal-boundary.py
          python3 scripts/check-public-brand.py
          python3 scripts/check-public-licenses.py
      - name: Install frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Rebuild native modules and build Desktop
        run: |
          pnpm --dir apps/desktop exec electron-rebuild --force --which-module better-sqlite3
          pnpm build
      - name: Package installers and updater manifests
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config.publish.provider=generic --config.publish.url=https://github.com/get3w/get3w/releases/latest/download
      - name: Verify macOS packaged engine
        if: matrix.platform == 'mac'
        run: |
          APP=$(find apps/desktop/dist-electron -maxdepth 2 -name Get3W.app -type d | head -1)
          test -n "$APP"
          pnpm --dir apps/desktop exec asar extract "$PWD/$APP/Contents/Resources/app.asar" "$RUNNER_TEMP/asar"
          python3 scripts/verify-public-package.py "$APP" "$RUNNER_TEMP/asar" "$RUNNER_TEMP/package-inventory.json"
          ELECTRON_RUN_AS_NODE=1 OPENWORK_TEST_EMBEDDED_MODULE_URL="file://$PWD/$APP/Contents/Resources/app.asar/server/dist/embedded.js" OPENWORK_TEST_ENGINE_BIN="$PWD/$APP/Contents/Resources/sidecars/opencode" "$APP/Contents/MacOS/Get3W" --test apps/desktop/test/engine-cold-start.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            apps/desktop/dist-electron/get3w-*
            apps/desktop/dist-electron/latest*.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts/release-input
      - name: Validate all six platforms and merge updater metadata
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 scripts/release/assemble.py artifacts/release-input artifacts/release-public "${GITHUB_REF_NAME#v}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Get3W $GITHUB_REF_NAME" --notes-file docs/release-notes.md
          gh release upload "$GITHUB_REF_NAME" artifacts/release-public/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
