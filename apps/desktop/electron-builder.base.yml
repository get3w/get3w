directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
files:
  - electron/**/*
  - server/**/*
  - "!server/dist/opencode-plugins/**"
  - package.json
  - from: .electron-runtime/node_modules
    to: node_modules
  # Workspace dependency collection also runs outside our runtime staging.
  - "!**/node_modules/@openwork/computer-use/native/**"
  - "!**/node_modules/@openwork/computer-use/**/*.test.mjs"
  - "!**/node_modules/**/.build/**"
extraResources:
  - from: ../../LICENSE
    to: legal/LICENSE
  - from: ../../NOTICE
    to: legal/NOTICE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: ../../third-party
    to: legal/third-party
  - from: .electron-runtime/openwork-sentry.json
    to: openwork-sentry.json
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: openwork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  # Keep Windows native code outside ASAR so it can be signed and audited.
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.node"
  # External tar cannot read an archive through Electron's virtual ASAR paths.
  - server/dist/opencode-plugin-deps-*.tgz
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
  # Blender loads computer use's script bridge from a real file.
  - electron/computer-scripting/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish: null
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Get3W uses the microphone when you allow a page to access audio input.
    NSAppleEventsUsageDescription: Get3W controls this app with a script when you approve a computer use task.
    NSSpeechRecognitionUsageDescription: Get3W turns your speech into text on this Mac when you dictate a message.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-apple-darwin
        - opencode2-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "Get3W Computer Use.app/**"
        - openwork-dictation
  target:
    - dmg
    - zip
linux:
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-unknown-linux-gnu
        - opencode2-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  signExts: [".dll", ".node"]
  signtoolOptions:
    sign: scripts/windows-sign.cjs
    signingHashAlgorithms: [sha256]
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/helpers
      to: helpers
      filter:
        - openwork-dictation.exe
        - openwork-computer-use.exe
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode2.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc
        - versions.json-x86_64-pc-windows-msvc
  target:
    - nsis
nsis:
  include: build/installer.nsh
